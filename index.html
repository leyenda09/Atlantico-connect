<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtlánticoConnect</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-blue-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-graduation-cap text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">AtlánticoConnect</h1>
            </div>
            <div class="flex items-center space-x-3">
                <span id="currentUserLabel" class="text-sm bg-blue-800 px-3 py-1 rounded-full font-medium">Ezequiel</span>
                <button onclick="switchUser()" class="text-xs bg-white text-blue-700 font-bold px-2.5 py-1 rounded shadow hover:bg-blue-50 transition">Cambiar</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Left Sidebar / Profile info -->
        <div class="md:col-span-1 space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
                <div class="w-20 h-20 bg-blue-600 text-white text-3xl font-bold rounded-full flex items-center justify-center mx-auto mb-3 shadow-inner" id="userAvatar">E</div>
                <h2 id="userNameDisplay" class="font-bold text-lg">Ezequiel de Luna</h2>
                <p class="text-xs text-slate-500">Ing. en Sistemas Computacionales</p>
                <div class="mt-4 pt-3 border-t border-slate-100 flex justify-around text-center text-xs">
                    <div>
                        <span class="block font-bold text-slate-700 text-sm" id="postCount">0</span>
                        <span class="text-slate-400">Publicaciones</span>
                    </div>
                    <div>
                        <span class="block font-bold text-slate-700 text-sm">UDA</span>
                        <span class="text-slate-400">Campus</span>
                    </div>
                </div>
            </div>

            <!-- Navegación Rápida -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-2">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Accesos Directos</h3>
                <button onclick="openKDSModal()" class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium hover:bg-slate-50 flex items-center space-x-2 text-slate-700">
                    <i class="fa-solid fa-utensils text-blue-600"></i>
                    <span>Cafetería / KDS (PIN: 1234)</span>
                </button>
            </div>
        </div>

        <!-- Feed Central -->
        <div class="md:col-span-2 space-y-6">
            
            <!-- Crear Publicación -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <textarea id="postInput" rows="3" class="w-full p-3 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm resize-none" placeholder="¿Qué quieres compartir con la comunidad universitaria hoy?"></textarea>
                <div class="flex justify-between items-center mt-3">
                    <div class="flex space-x-2 text-slate-400 text-sm">
                        <span class="text-xs bg-slate-100 px-2.5 py-1 rounded-md font-medium text-slate-600">Feed General 🌐</span>
                    </div>
                    <button onclick="createPost()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg text-sm shadow transition">Publicar</button>
                </div>
            </div>

            <!-- Listado de Posts -->
            <div id="postsContainer" class="space-y-4">
                <!-- Los posts se cargarán aquí en tiempo real desde Firebase -->
                <div class="text-center py-8 text-slate-400 text-sm">Cargando publicaciones en tiempo real...</div>
            </div>
        </div>
    </main>

    <!-- Modal KDS / Cafetería -->
    <div id="kdsModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-lg text-slate-800">Terminal de Cafetería (KDS)</h3>
                <button onclick="closeKDSModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <p class="text-xs text-slate-500">Ingresa el PIN de acceso a cocina (PIN por defecto: <strong>1234</strong>)</p>
            <input type="password" id="kdsPinInput" maxlength="4" class="w-full text-center tracking-widest text-xl p-3 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••">
            <button onclick="verifyKDSPin()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-2.5 rounded-lg text-sm transition">Acceder a Cocina</button>
        </div>
    </div>

    <!-- Firebase SDKs vía CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuración de Firebase provista
        const firebaseConfig = {
            apiKey: "AIzaSyApOEnwOwygIL2U1x_cSQFTm0_FOC7gZT4",
            authDomain: "atlantico-connect.firebaseapp.com",
            projectId: "atlantico-connect",
            storageBucket: "atlantico-connect.firebasestorage.app",
            messagingSenderId: "170888741251",
            appId: "1:170888741251:web:4928cdd5751f69288bb6b6",
            measurementId: "G-HP8HDL3933"
        };

        // Inicializar Firebase y Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Gestión de usuarios simulados
        const users = [
            { name: "Ezequiel de Luna", role: "Ing. Sistemas", initial: "E" },
            { name: "María López", role: "Lic. Administración", initial: "M" },
            { name: "Carlos Pérez", role: "Ing. Industrial", initial: "C" }
        ];
        let currentUserIndex = 0;

        window.switchUser = function() {
            currentUserIndex = (currentUserIndex + 1) % users.length;
            const u = users[currentUserIndex];
            document.getElementById('currentUserLabel').innerText = u.name.split(' ')[0];
            document.getElementById('userNameDisplay').innerText = u.name;
            document.getElementById('userAvatar').innerText = u.initial;
        }

        // Crear Publicación en Firestore
        window.createPost = async function() {
            const text = document.getElementById('postInput').value.trim();
            if (!text) return;

            const u = users[currentUserIndex];
            try {
                await addDoc(collection(db, "posts"), {
                    author: u.name,
                    initial: u.initial,
                    role: u.role,
                    content: text,
                    createdAt: serverTimestamp()
                });
                document.getElementById('postInput').value = '';
            } catch (e) {
                console.error("Error al publicar: ", e);
                alert("Hubo un error al publicar en la nube.");
            }
        }

        // Escuchar publicaciones en Tiempo Real con Firestore (onSnapshot)
        const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const container = document.getElementById('postsContainer');
            container.innerHTML = '';
            
            let count = 0;
            snapshot.forEach((docSnap) => {
                const post = docSnap.data();
                count++;
                
                const timeStr = post.createdAt ? "Hace un momento" : "Publicando...";
                
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3";
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 bg-blue-100 text-blue-700 font-bold rounded-full flex items-center justify-center">${post.initial || 'U'}</div>
                            <div>
                                <h4 class="font-bold text-sm text-slate-800">${post.author || 'Anónimo'}</h4>
                                <p class="text-xs text-slate-400">${post.role || 'Estudiante'} • ${timeStr}</p>
                            </div>
                        </div>
                    </div>
                    <p class="text-sm text-slate-700 whitespace-pre-line">${post.content}</p>
                `;
                container.appendChild(card);
            });

            if (count === 0) {
                container.innerHTML = '<div class="text-center py-8 text-slate-400 text-sm bg-white rounded-xl border border-slate-200">Aún no hay publicaciones. ¡Sé el primero en escribir algo!</div>';
            }
            document.getElementById('postCount').innerText = count;
        });

        // Funciones del Modal KDS
        window.openKDSModal = function() {
            document.getElementById('kdsModal').classList.remove('hidden');
        }
        window.closeKDSModal = function() {
            document.getElementById('kdsModal').classList.add('hidden');
            document.getElementById('kdsPinInput').value = '';
        }
        window.verifyKDSPin = function() {
            const pin = document.getElementById('kdsPinInput').value;
            if (pin === "1234") {
                alert("¡PIN Correcto! Acceso autorizado a la cocina.");
                closeKDSModal();
            } else {
                alert("PIN incorrecto. Intenta con 1234.");
            }
        }
    </script>
</body>
</html>
